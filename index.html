<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente della Masseria · Sapori di Puglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat">
  <header>
    <div class="av"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M5 23C10 17 14 12 22 5" stroke="#5b6b2f" stroke-width="2" stroke-linecap="round"/><g fill="#5b6b2f"><ellipse cx="9" cy="15" rx="4" ry="2" transform="rotate(-40 9 15)"/><ellipse cx="14" cy="10" rx="4" ry="2" transform="rotate(-40 14 10)"/><ellipse cx="14" cy="18" rx="4" ry="2" transform="rotate(10 14 18)"/><ellipse cx="19" cy="13" rx="4" ry="2" transform="rotate(10 19 13)"/></g><circle cx="21" cy="21" r="3" fill="#b5532f"/></svg></div>
    <div><h1>Assistente della Masseria</h1><small>Sapori di Puglia · online</small></div>
    <button class="cart" id="cartBtn" type="button">🛒 <span id="cnt">0</span></button>
    <button class="cart" id="resetBtn" type="button" title="Nuova chat" aria-label="Nuova chat">↺</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><input id="in" placeholder="Scrivi qui, ad esempio “taralli”…" autocomplete="off" aria-label="Messaggio"><button aria-label="Invia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
</div>
<script src="script.js"></script>
